<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0E2445" />
      <stop offset="50%" stop-color="#0A1F3C" />
      <stop offset="100%" stop-color="#051326" />
    </linearGradient>

    <!-- Cross Gradient -->
    <linearGradient id="crossGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1D6FE8" />
      <stop offset="50%" stop-color="#14B8A6" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <!-- Radial Core Glow -->
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#14B8A6" stop-opacity="0.32" />
      <stop offset="100%" stop-color="#14B8A6" stop-opacity="0" />
    </radialGradient>

    <!-- Drop Shadow / Glow for Cross -->
    <filter id="crossGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="16" flood-color="#14B8A6" flood-opacity="0.55" />
    </filter>

    <!-- Soft Glow for Pulse -->
    <filter id="pulseGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#14B8A6" flood-opacity="0.9" />
    </filter>
  </defs>

  <!-- Background Base Squircle -->
  <rect width="512" height="512" rx="116" fill="url(#bgGrad)" />
  <rect x="6" y="6" width="500" height="500" rx="110" fill="none" stroke="#14B8A6" stroke-opacity="0.45" stroke-width="6" />

  <!-- Ambient Core Glow -->
  <circle cx="256" cy="256" r="210" fill="url(#coreGlow)" />

  <!-- Matrix Orbit & Network Grid Lines -->
  <circle cx="256" cy="256" r="196" fill="none" stroke="#1D6FE8" stroke-opacity="0.28" stroke-width="2.5" stroke-dasharray="10 10" />
  <circle cx="256" cy="256" r="140" fill="none" stroke="#14B8A6" stroke-opacity="0.22" stroke-width="2" stroke-dasharray="8 8" />

  <!-- Matrix Network Corner Connectors -->
  <g stroke="#14B8A6" stroke-opacity="0.35" stroke-width="2.5" stroke-dasharray="7 7">
    <line x1="110" y1="110" x2="185" y2="185" />
    <line x1="402" y1="110" x2="327" y2="185" />
    <line x1="110" y1="402" x2="185" y2="327" />
    <line x1="402" y1="402" x2="327" y2="327" />
  </g>

  <!-- Matrix Corner Nodes -->
  <g>
    <!-- Top-Left Node -->
    <circle cx="110" cy="110" r="18" fill="#0A1F3C" stroke="#14B8A6" stroke-width="3.5" />
    <circle cx="110" cy="110" r="7" fill="#7FE0B0" />

    <!-- Top-Right Node -->
    <circle cx="402" cy="110" r="18" fill="#0A1F3C" stroke="#1D6FE8" stroke-width="3.5" />
    <circle cx="402" cy="110" r="7" fill="#4C9AFF" />

    <!-- Bottom-Left Node -->
    <circle cx="110" cy="402" r="18" fill="#0A1F3C" stroke="#1D6FE8" stroke-width="3.5" />
    <circle cx="110" cy="402" r="7" fill="#4C9AFF" />

    <!-- Bottom-Right Node -->
    <circle cx="402" cy="402" r="18" fill="#0A1F3C" stroke="#14B8A6" stroke-width="3.5" />
    <circle cx="402" cy="402" r="7" fill="#7FE0B0" />
  </g>

  <!-- Bold Healthcare Cross -->
  <g filter="url(#crossGlow)">
    <rect x="204" y="96" width="104" height="320" rx="34" fill="url(#crossGrad)" />
    <rect x="96" y="204" width="320" height="104" rx="34" fill="url(#crossGrad)" />
  </g>

  <!-- Central Vitality Pulse (ECG Heartbeat line) -->
  <g filter="url(#pulseGlow)">
    <path d="M 120 256 L 192 256 L 212 276 L 244 146 L 274 362 L 302 236 L 322 256 L 392 256"
          fill="none" stroke="#14B8A6" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" opacity="0.8" />
    <path d="M 120 256 L 192 256 L 212 276 L 244 146 L 274 362 L 302 236 L 322 256 L 392 256"
          fill="none" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Cardiac Wave Peak and Valley Data Dots -->
  <circle cx="244" cy="146" r="9" fill="#7FE0B0" />
  <circle cx="244" cy="146" r="4" fill="#FFFFFF" />

  <circle cx="274" cy="362" r="9" fill="#4C9AFF" />
  <circle cx="274" cy="362" r="4" fill="#FFFFFF" />
</svg>

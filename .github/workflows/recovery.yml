name: Encrypted recovery verification
on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'
permissions:
  contents: read
concurrency:
  group: recovery-verification
  cancel-in-progress: false
jobs:
  recover:
    runs-on: ubuntu-latest
    environment: recovery
    timeout-minutes: 60
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
      BACKUP_AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_AWS_ACCESS_KEY_ID }}
      BACKUP_AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_AWS_SECRET_ACCESS_KEY }}
      BACKUP_S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
      BACKUP_ENDPOINT_URL: ${{ secrets.BACKUP_ENDPOINT_URL }}
      BACKUP_AWS_REGION: ${{ secrets.BACKUP_AWS_REGION }}
      POSTGRES_BIN: /usr/lib/postgresql/18/bin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-18 postgresql-client-18
      - run: npm ci --ignore-scripts
      - run: npm run prisma:generate
      - run: node scripts/scheduled-recovery.mjs
      # Database archives and recovery keys must never be uploaded as CI artifacts.
